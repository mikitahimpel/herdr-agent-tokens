id = "agent-tokens"
name = "Agent Tokens"
version = "0.5.0"
min_herdr_version = "0.9.0"
description = "Token usage dashboard for Claude Code and Codex agents"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "dashboard"
title = "Token usage dashboard"
contexts = ["global", "workspace", "tab", "pane"]
command = ["target/release/agent-tokens", "open"]

[[panes]]
id = "dashboard"
title = "Agent Tokens"
placement = "popup"
width = "80%"
height = "75%"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/agent-tokens\""]

[[link_handlers]]
id = "statusline"
title = "Open token usage dashboard"
pattern = "^https://agent-tokens\\.invalid/open"
action = "dashboard"
