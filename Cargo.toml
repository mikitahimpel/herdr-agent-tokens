[package]
name = "agent-tokens"
version = "0.4.0"
edition = "2021"
description = "Herdr plugin: token usage dashboard for Claude Code and Codex agents"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = "0.30"
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
