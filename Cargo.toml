[package]
name = "agent-tokens"
version = "0.8.0"
edition = "2021"
description = "Herdr plugin: token usage dashboard for Claude Code and Codex agents"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
lto = "thin"
strip = true
